[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlscanner"
version = "0.3.0"
description = "Agent-friendly SystemVerilog RTL analysis powered by pyslang."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pyslang>=11.0.0",
  # TOML config reading: tomllib is stdlib on 3.11+; pull tomli on 3.8-3.10
  # so `pip install` makes .rtlscanner.toml work out of the box (3.8+ claim).
  "tomli>=1.1.0 ; python_version < '3.11'",
]

[project.scripts]
rtlscanner = "rtlscanner:main"

[tool.setuptools]
# Every top-level module under src/ must be listed here, or a non-editable
# install (`pip install .` / wheel / PyPI) ships an incomplete package and the
# `rtlscanner` entry point dies on first import.  Kept honest by
# tests/test_packaging_modules.py.  Editable installs (`pip install -e .`) put
# all of src/ on sys.path and would otherwise mask a missing entry.
py-modules = [
  "rtlscanner", "rtl_tree", "rtl_common", "rtl_config", "rtl_cli", "rtl_slang",
  "rtl_dataflow", "signal_cli", "signal_trace", "signal_flow",
  "rtl_lint", "rtl_scope", "rtl_xref", "agent_json", "rtl_batch",
]
package-dir = {"" = "src"}
