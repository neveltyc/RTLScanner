[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlscanner"
version = "0.1.3"
description = "Agent-friendly SystemVerilog RTL analysis powered by pyslang."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pyslang>=11.0.0",
]

[project.scripts]
rtlscanner = "rtlscanner:main"

[tool.setuptools]
py-modules = ["rtlscanner", "rtl_tree", "rtl_common", "rtl_config", "rtl_cli", "rtl_slang", "signal_trace", "rtl_lint", "rtl_scope", "rtl_xref", "agent_json"]
package-dir = {"" = "src"}
