name: CI

# `push` is limited to main so a branch with an open pull request is not built
# twice for one commit; work in progress is covered by the `pull_request` event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A second push supersedes the first rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build and the static checks only. The test suite — `make test`, and
# `make test-cores` with the exporter and the pinned cores — is run locally;
# crates/rtlscanner/tests/real_cores.rs names the corpus and its pins.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-

      - run: make build
      - run: make check

  windows-artifact:
    name: windows-artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rtlscanner-windows-amd64
          path: target/release/rtlscanner.exe
