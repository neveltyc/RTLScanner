[workspace]
members = ["crates/designdb", "crates/rtlscanner"]
resolver = "3"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/neveltyc/RTLScanner"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
